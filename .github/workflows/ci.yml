name: FHDSS Continuous Integration (CI)

on:
  push:
    branches: [ "master", "main", "sprint*" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  backend-tests:
    name: Backend Test Suite (Pytest & Alembic)
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Python 3.12 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Sistem Kütüphaneleri (OpenCV & Cairo)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libglib2.0-0 libcairo2 libpango-1.0-0

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install redis pytest-asyncio

      - name: Alembic Migrasyon Doğrulaması
        env:
          DATABASE_URL: "sqlite+aiosqlite:///ci_test.db"
          ENVIRONMENT: "test"
          SECRET_KEY: "ci-testing-super-secret-key-for-fhdss-32chars"
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Pytest Test Paketini Koştur
        env:
          ENVIRONMENT: "test"
          SECRET_KEY: "ci-testing-super-secret-key-for-fhdss-32chars"
          DATABASE_URL: "sqlite+aiosqlite:///ci_test.db"
        run: |
          pytest -v --tb=short

  frontend-build:
    name: Frontend Derleme ve Tip Kontrolü (Next.js)
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Node.js 20 Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Bağımlılıkları Yükle
        run: |
          cd frontend
          npm ci || npm install

      - name: Next.js Derleme (Build & Typecheck)
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000/api/v1"
        run: |
          cd frontend
          npm run build
