[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forensic-handwriting-ai"
version = "0.1.0"
description = "AI-based Explainable and Auditable Forensic Handwriting Decision Support System"
authors = [{ name = "Tubitak BilirKisi AI Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "opencv-python-headless>=4.10.0",
    "pillow>=10.4.0",
    "scikit-image>=0.24.0",
    "numpy>=1.26.0",
    "kornia>=0.7.3",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "timm>=1.0.0",
    "pytorch-metric-learning>=2.6.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.0",
    "networkx>=3.3",
    "rustworkx>=0.15.0",
    "catboost>=1.2.0",
    "captum>=0.7.0",
    "shap>=0.46.0",
    "weasyprint>=62.0",
    "typst>=0.11.0",
    "pyhanko>=0.25.0",
    "loguru>=0.7.2",
    "python-dotenv>=1.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "strict"
